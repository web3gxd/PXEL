name: foundation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUST_TEST_THREADS: '2'
      NEXTEST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install pinned tools
        run: |
          rustup show
          npm install --global pnpm@12.6.0
          pnpm --version
          cargo install --locked just --version 1.58.0
          cargo install --locked cargo-nextest --version 0.9.146
          cargo install --locked sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: Install locked dependencies and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pxel/web exec playwright install --with-deps chromium
      - name: Real PostgreSQL with durable settings
        run: |
          just infra-up
          docker compose config --quiet
      - name: Verify generated protobuf and API compatibility
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm proto:check
          if [ -n "$BASE_REF" ] && git cat-file -e "$BASE_REF:proto/wire-descriptor.bin" 2>/dev/null; then
            git show "$BASE_REF:proto/wire-descriptor.bin" > .local/base-wire-descriptor.bin
            pnpm exec buf breaking proto --against .local/base-wire-descriptor.bin
          fi
      - name: Format, lint, unit, DB tests and builds
        run: |
          export DATABASE_URL="$(cat .local/database-url)"
          just check
          just test
          just sqlx-check
          SQLX_OFFLINE=true cargo build --locked --workspace
      - name: Real HTTP, WebSocket and Chromium checks
        run: just smoke
      - name: Native and actual browser Worker WASM formula parity
        run: just formula-parity
      - name: Dependency policy and advisories
        run: just audit
      - name: Stop ephemeral database
        if: always()
        run: docker compose down
