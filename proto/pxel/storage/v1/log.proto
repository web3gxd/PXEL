syntax = "proto3";
package pxel.storage.v1;
message EventEnvelope {
 uint32 schema_version = 1;
 bytes document_id = 2;
 bytes operation_id = 3;
 bytes actor_id = 4;
 uint64 committed_version = 5;
 bytes state_hash = 6;
 Operation operation = 7;
 EventPrincipalKind principal_kind = 8;
}
enum EventPrincipalKind {
 EVENT_PRINCIPAL_KIND_UNSPECIFIED = 0;
 EVENT_PRINCIPAL_KIND_USER = 1;
 EVENT_PRINCIPAL_KIND_SYSTEM = 2;
}
message Operation {
 oneof kind {
  CreateWorkbook create_workbook = 1;
  SetCellValue set_cell_value = 2;
  CellAddress clear_cell = 3;
  SetCellFormula set_cell_formula = 4;
  AdvanceCalculationEpoch advance_calculation_epoch = 5;
  ExtendRows extend_rows = 6;
  InsertRows insert_rows = 7;
  InsertRows insert_rows_rebased = 8;
  DeleteRows delete_rows = 9;
  InsertColumns insert_columns_rebased = 10;
  DeleteColumns delete_columns = 11;
  SetCellValues set_cell_values = 12;
  CellWrite authored_cell_write = 13;
  CellWrite compensating_cell_write = 14;
  CopyRange copy_range = 15;
  CreateWorkbook add_sheet = 16;
  RangeWrite authored_range_write = 17;
  RangeWrite compensating_range_write = 18;
  MoveRange move_range = 19;
  MoveCompensation move_compensation = 20;
  AxisChange axis_edit = 21;
  AxisCompensation axis_compensation = 22;
  StyleWrite style_write = 23;
  StyleCompensation style_compensation = 24;
 }
}
// Profile 1 uses the frozen sixteen leaf-property tags. A value kind must match
// its property; reset is represented by true, never by a missing value.
message StyleChange {
 uint32 property = 1;
 oneof kind {
  bool reset = 2;
  string font_family = 3;
  uint32 font_size = 4;
  bool boolean = 5;
  uint32 enumeration = 6;
  uint32 rgb = 7;
  StyleBorder border = 8;
 }
}
message StyleBorder { uint32 line = 1; uint32 rgb = 2; }
message CellStyle { uint32 profile_version = 1; repeated StyleChange changes = 2; }
message GuardedStyleWrite {
 CellAddress address = 1;
 repeated StyleChange previous = 2;
 repeated StyleChange changes = 3;
}
message StyleWrite { uint32 kind = 1; repeated GuardedStyleWrite writes = 2; }
message StyleCompensation {
 StyleWrite write = 1;
 bytes undoes_operation_id = 2;
 uint64 undoes_version = 3;
}
message AdvanceCalculationEpoch {
 bytes context_id = 1;
 uint64 calculation_epoch = 2;
 int64 effective_timestamp_utc_ms = 3;
 sint32 utc_offset_minutes = 4;
 sint32 civil_day_since_unix_epoch = 5;
 bytes random_seed = 6;
 string engine_version = 7;
 string compatibility_profile = 8;
 CalculationReason reason = 9;
}
enum CalculationReason {
 CALCULATION_REASON_UNSPECIFIED = 0;
 CALCULATION_REASON_OPEN = 1;
 CALCULATION_REASON_EXPLICIT = 2;
 CALCULATION_REASON_TIMER = 3;
 CALCULATION_REASON_VOLATILE_DEPENDENCY = 4;
 CALCULATION_REASON_ENGINE_UPGRADE = 5;
}
message CreateWorkbook { bytes sheet_id = 1; string name = 2; repeated bytes rows = 3; repeated bytes columns = 4; }
message ExtendRows { bytes sheet_id = 1; repeated bytes rows = 2; }
message InsertRows { bytes sheet_id = 1; bytes before_row_id = 2; repeated bytes rows = 3; }
message DeleteRows { bytes sheet_id = 1; repeated bytes rows = 2; }
message InsertColumns { bytes sheet_id = 1; bytes before_column_id = 2; repeated bytes columns = 3; }
message DeleteColumns { bytes sheet_id = 1; repeated bytes columns = 2; }
message SetCellValues { repeated SetCellValue writes = 1; }
// Schema 11/12 preserve the preimage; 13 restores formulas; 16 authors formulas.
message CellWrite {
 CellAddress address = 1;
 CellContent content = 2;
 CellContent previous = 3;
 bytes undoes_operation_id = 4;
 uint64 undoes_version = 5;
 AuthoredWriteKind authored_kind = 6;
}
message CellContent { oneof kind { CellValue value = 1; BoundFormula formula = 2; } }
// Schema 14 freezes all destinations. Missing content clears the destination.
message CopyRange { repeated ContentWrite writes = 1; }
message ContentWrite { CellAddress address = 1; CellContent content = 2; }
// Schema 17/18 freeze every destination and its exact preimage.
message RangeWrite {
 repeated GuardedContentWrite writes = 1;
 bytes undoes_operation_id = 2;
 uint64 undoes_version = 3;
 AuthoredRangeWriteKind authored_kind = 4;
}
message GuardedContentWrite {
 CellAddress address = 1;
 CellContent content = 2;
 CellContent previous = 3;
}
// Schema 19 freezes cut destinations, clears and inbound reference changes.
message MoveRange {
 CellAddress source = 1;
 CellAddress destination = 2;
 uint32 rows = 3;
 uint32 columns = 4;
 repeated GuardedContentWrite writes = 5;
}
// Schema 20 freezes an inverse move and its mandatory compensated event identity.
message MoveCompensation {
 CellAddress source = 1;
 CellAddress destination = 2;
 uint32 rows = 3;
 uint32 columns = 4;
 repeated GuardedContentWrite writes = 5;
 bytes undoes_operation_id = 6;
 uint64 undoes_version = 7;
}
// Schema 21 freezes a single-axis edit and its exact inverse and cell preimages.
message AxisChange {
 bytes sheet_id = 1;
 AxisDelta delta = 2;
 AxisDelta inverse_delta = 3;
 repeated GuardedContentWrite writes = 4;
 bytes before_order_hash = 5;
 bytes after_order_hash = 6;
}
message AxisDelta {
 oneof kind {
  RowDelta rows = 1;
  ColumnDelta columns = 2;
 }
}
message RowDelta { repeated bytes removed = 1; repeated RowPlacement inserted = 2; }
message ColumnDelta { repeated bytes removed = 1; repeated ColumnPlacement inserted = 2; }
message RowPlacement { bytes row_id = 1; bytes before_row_id = 2; }
message ColumnPlacement { bytes column_id = 1; bytes before_column_id = 2; }
// Schema 22 revives retired identities only as a provenance-checked compensation.
message AxisCompensation {
 AxisChange change = 1;
 bytes undoes_operation_id = 2;
 uint64 undoes_version = 3;
}
enum AuthoredRangeWriteKind {
 AUTHORED_RANGE_WRITE_KIND_UNSPECIFIED = 0;
 AUTHORED_RANGE_WRITE_KIND_SET_VALUES = 1;
 AUTHORED_RANGE_WRITE_KIND_COPY = 2;
}
enum AuthoredWriteKind {
 AUTHORED_WRITE_KIND_UNSPECIFIED = 0;
 AUTHORED_WRITE_KIND_SET_VALUE = 1;
 AUTHORED_WRITE_KIND_CLEAR = 2;
 AUTHORED_WRITE_KIND_SET_FORMULA = 3;
}
message CellAddress { bytes sheet_id = 1; bytes row_id = 2; bytes column_id = 3; }
message SetCellValue { CellAddress address = 1; CellValue value = 2; }
message CellValue { oneof kind { bool blank = 1; double number = 2; string text = 3; bool boolean = 4; } }

message SetCellFormula { CellAddress address = 1; BoundFormula formula = 2; }
message BoundFormula {
 string source = 1;
 string canonical = 2;
 BoundAst ast = 3;
 CellAddress origin = 4;
 uint64 bound_at_version = 5;
 CompatibilityProfile compatibility_profile = 6;
}
enum CompatibilityProfile { COMPATIBILITY_PROFILE_UNSPECIFIED = 0; COMPATIBILITY_PROFILE_EXCEL_SUBSET_V1 = 1; }
message BoundAst { uint32 schema_version = 1; uint32 root = 2; repeated FormulaNode nodes = 3; }
message FormulaNode {
 oneof kind {
  double number = 1;
  string text = 2;
  bool boolean = 3;
  FormulaError error = 4;
  bool missing = 5;
  BoundCellReference cell = 6;
  BoundRangeReference range = 7;
  ReferenceError invalid_reference = 8;
  UnaryNode unary = 9;
  BinaryNode binary = 10;
  CallNode call = 11;
 }
}
message AxisReferenceMode { oneof kind { bool absolute = 1; sint64 relative_delta = 2; } }
message BoundCellReference {
 bytes sheet_id = 1;
 bytes row_id = 2;
 bytes column_id = 3;
 AxisReferenceMode row_mode = 4;
 AxisReferenceMode column_mode = 5;
}
message BoundRangeReference { BoundCellReference start = 1; BoundCellReference end = 2; }
message UnaryNode { UnaryOperator operator = 1; uint32 operand = 2; }
message BinaryNode { BinaryOperator operator = 1; uint32 left = 2; uint32 right = 3; }
message CallNode { string name = 1; repeated uint32 arguments = 2; }
enum UnaryOperator { UNARY_OPERATOR_UNSPECIFIED = 0; UNARY_OPERATOR_PLUS = 1; UNARY_OPERATOR_MINUS = 2; UNARY_OPERATOR_PERCENT = 3; }
enum BinaryOperator {
 BINARY_OPERATOR_UNSPECIFIED = 0;
 BINARY_OPERATOR_ADD = 1;
 BINARY_OPERATOR_SUBTRACT = 2;
 BINARY_OPERATOR_MULTIPLY = 3;
 BINARY_OPERATOR_DIVIDE = 4;
 BINARY_OPERATOR_POWER = 5;
 BINARY_OPERATOR_CONCAT = 6;
 BINARY_OPERATOR_EQUAL = 7;
 BINARY_OPERATOR_NOT_EQUAL = 8;
 BINARY_OPERATOR_LESS = 9;
 BINARY_OPERATOR_LESS_EQUAL = 10;
 BINARY_OPERATOR_GREATER = 11;
 BINARY_OPERATOR_GREATER_EQUAL = 12;
}
enum FormulaError {
 FORMULA_ERROR_UNSPECIFIED = 0;
 FORMULA_ERROR_NULL = 1;
 FORMULA_ERROR_DIV0 = 2;
 FORMULA_ERROR_VALUE = 3;
 FORMULA_ERROR_REF = 4;
 FORMULA_ERROR_NAME = 5;
 FORMULA_ERROR_NUM = 6;
 FORMULA_ERROR_NA = 7;
 FORMULA_ERROR_SPILL = 8;
 FORMULA_ERROR_CYCLE = 9;
}
enum ReferenceError {
 REFERENCE_ERROR_UNSPECIFIED = 0;
 REFERENCE_ERROR_DELETED_TARGET = 1;
 REFERENCE_ERROR_OUT_OF_BOUNDS = 2;
 REFERENCE_ERROR_MISSING_SHEET = 3;
}
