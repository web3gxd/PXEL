syntax = "proto3";
package pxel.storage.v1;

import "pxel/storage/v1/log.proto";

// Independent persisted format; do not interpret the event schema version here.
message SnapshotEnvelope {
  uint32 snapshot_schema_version = 1;
  bytes document_id = 2;
  uint64 document_version = 3;
  uint64 last_axis_change_version = 4;
  CreateWorkbook sheet = 5;
  repeated SnapshotCell cells = 6;
  repeated bytes retired_rows = 7;
  repeated bytes retired_columns = 8;
  AdvanceCalculationEpoch calculation_context = 9;
  bytes state_hash = 10;
  string writer_engine_version = 11;
  string writer_compatibility_profile = 12;
  // Schema 2 stores every sheet in visible order. Schema 1 keeps fields 5/6.
  repeated SnapshotSheet sheets = 13;
  // Schema 3 retains the latest activation floor even after a revived axis is deleted again.
  repeated RowActivationFloor row_activation_floors = 14;
  repeated ColumnActivationFloor column_activation_floors = 15;
}
message RowActivationFloor { bytes row_id = 1; uint64 document_version = 2; }
message ColumnActivationFloor { bytes column_id = 1; uint64 document_version = 2; }

message SnapshotCell {
  CellAddress address = 1;
  CellContent content = 2;
}
message SnapshotSheet {
  CreateWorkbook sheet = 1;
  repeated SnapshotCell cells = 2;
  // Schema 4 adds independent non-default styles, including styled blanks.
  repeated SnapshotStyle styles = 3;
}
message SnapshotStyle { CellAddress address = 1; CellStyle style = 2; }
