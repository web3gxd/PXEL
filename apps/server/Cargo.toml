[package]
license.workspace = true
authors.workspace = true
repository.workspace = true
name = "pxel-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
dev-auth = []
legacy-migration = ["spreadsheet-storage/legacy-migration"]
s3 = ["spreadsheet-storage/s3"]

[dependencies]
spreadsheet-domain.workspace = true
spreadsheet-application.workspace = true
spreadsheet-collab.workspace = true
spreadsheet-formula.workspace = true
spreadsheet-storage.workspace = true
spreadsheet-wire-protocol.workspace = true
spreadsheet-xlsx = { workspace = true, features = ["worker-protocol"] }
anyhow.workspace = true
thiserror.workspace = true
zeroize.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
base64 = "=0.22.1"
getrandom.workspace = true
url.workspace = true
percent-encoding = "=2.3.2"
same-file = "=1.0.6"
axum.workspace = true
futures-util.workspace = true
prost.workspace = true
process-wrap = { version = "=10.0.1", default-features = false, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
processkit = { version = "=3.3.4", default-features = false, features = ["limits"] }
serde.workspace = true
serde_json = "=1.0.151"
sha2.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[dev-dependencies]
tempfile.workspace = true
